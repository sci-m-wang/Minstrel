schema_version: 1
active_panels: [A, D]
supported_conditions:
  - none
  - personality
  - summary
  - gold
  - ours
internal_condition_definitions:
  none: "Anonymous Vanilla: no persona information."
  personality: "Personality Only: per-probe Big Five observations from each probe's Top-10, then aggregated into an anonymous Big Five description."
  summary: "Generic Summary: per-probe summaries from each probe's Top-10, then aggregated into one anonymous person summary."
  gold: "Anonymous Gold Profile: the official benchmark profile with identity strings removed."
  ours: "Ours: 24 probes, evidence-cited cues, and the reconstructed anonymous Person Model."
external_baselines:
  AMADEUS: "Panel B official method; attempt in the non-blocking baseline lane."
  RoleGPT_RoleLLM: "Panel C official method; attempt in the non-blocking baseline lane."
  PersonaForge: "Panel C official method; attempt in the non-blocking baseline lane."
  CoSER: "Panel C specialized reference; attempt in the non-blocking baseline lane."
external_baseline_attempt_policy:
  mode: best_effort_nonblocking
  priority: core_preflight_and_execution
  methods: [AMADEUS, RoleGPT_RoleLLM, PersonaForge, CoSER]
  official_artifacts_only: true
  modify_method: false
  failure_effect_on_core: none
  evidence_path: runs/external-baselines/<method>/attempt-status.json
restore_gate:
  - pinned official source revision
  - licensed input data and model artifacts
  - adapter producing the common GenerationRecord schema
  - preflight checks
  - synthetic end-to-end test
